name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Ruff
        run: |
          uvx ruff check .
          uvx ruff format --check .
      - name: Lock file is up to date
        run: uv lock --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install with the CPU build of torch
        run: |
          uv venv
          uv pip install --torch-backend=cpu -e . pytest
      - name: Tests (CUDA-only tests are skipped)
        run: .venv/bin/python -m pytest
