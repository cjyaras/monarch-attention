[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ma"]

[project]
name = "monarch-attention"
version = "0.0.1"
dependencies = [
    "torch>=2.6.0",
    "einops",
]
requires-python = ">=3.11"
authors = [
  {name = "Can Yaras", email = "cjyaras@gmail.com"},
]
description = "Monarch attention."
readme = "README.md"
license = {file = "LICENSE"}
keywords = []

[project.optional-dependencies]
experiments = [
    "numpy",
    "tqdm",
    "matplotlib",
    "torchvision",
    "torch_geometric",
    "torchtnt",
    "setuptools<81",  # torchtnt imports pkg_resources
    "transformers>=5",
    "diffusers",
    "datasets",
    "evaluate[evaluator]",  # evaluator extra pulls in scipy
    "nltk",
    "rouge_score",
    "accelerate",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
# Triton compiles a C launcher at runtime and needs Python headers, which
# system Pythons often lack; uv-managed Pythons always ship them.
python-preference = "only-managed"
