[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ma"]

[project]
name = "monarch-attention"
version = "0.0.1"
dependencies = [
    "torch>=2.6.0",
]
requires-python = ">=3.14"
authors = [
  {name = "Can Yaras", email = "cjyaras@gmail.com"},
]
description = "MonarchAttention: sub-quadratic attention via Monarch matrices."
readme = "README.md"
license = {file = "LICENSE"}

[project.optional-dependencies]
experiments = [
    "einops",
    "numpy",
    "tqdm",
    "matplotlib",
    "torchvision",
    "torch_geometric",
    "torchtnt",
    "setuptools<81",  # torchtnt imports pkg_resources
    "transformers>=5",
    "diffusers",
    "datasets",
    "evaluate",
    "nltk",
    "rouge_score",
    "accelerate",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
# Triton compiles a C launcher at runtime and needs Python headers, which
# system Pythons often lack; uv-managed Pythons always ship them.
python-preference = "only-managed"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E741",  # single-letter index names like `l` mirror the math
    "E731",  # `grid = lambda meta: ...` is the Triton idiom
]
